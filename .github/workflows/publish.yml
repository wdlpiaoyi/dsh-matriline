name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1 for the OIDC exchange; the npm
      # bundled with Node 22 is 10.x, so upgrade before publishing.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json $pkg" >&2
            exit 1
          fi

      - name: Check sources
        run: |
          node --check index.js
          node --check client.js
          node --check state/index.js
          node --test

      # Auth is optional on purpose: one of
      #   1. the NPM_TOKEN secret (an npm automation token) — used before the
      #      package exists, because it both publishes and claims the name;
      #   2. trusted publishing — after the package exists, configure it on
      #      npmjs.com (Trusted Publisher: GitHub Actions / wdlpiaoyi /
      #      dsh-matriline / publish.yml / no environment, allowed action
      #      `npm publish`). With no token in .npmrc, npm trades the GitHub
      #      OIDC token for a short-lived publish token.
      - name: Configure npm auth (only when NPM_TOKEN is set)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> "$NPM_CONFIG_USERCONFIG"
          else
            echo "no NPM_TOKEN secret: relying on trusted publishing (OIDC)"
          fi

      # Provenance links the tarball to this commit and works with either auth mode.
      - name: Publish to npm
        run: npm publish --access public --provenance